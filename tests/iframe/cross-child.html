<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Cross-origin child</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; margin: 8px; background: #f8e8e0; color: #3a2e28; }</style>
</head><body>
<h3>I am a frame of another origin</h3>
<p id="secret">the child's private paragraph</p>
<script>
  report('cross-child', 'origin', location.origin);
  report('cross-child', 'parent-document', tryit(function () { return parent.document; }));
  report('cross-child', 'parent-body', tryit(function () { return parent.document.body.innerHTML; }));
  report('cross-child', 'parent-location', tryit(function () { return parent.location.href; }));
  report('cross-child', 'top-title', tryit(function () { return top.document.title; }));
  report('cross-child', 'parent-length', tryit(function () { return parent.length; }));
  report('cross-child', 'parent-frames-0', tryit(function () { return typeof parent.frames[0]; }));
  report('cross-child', 'own', String(parent !== window) + ' ' + String(top === parent) + ' ' + tryit(function () { return window.frameElement; }));
  parent.postMessage('hello from ' + location.hostname, '*');
</script>
</body></html>
