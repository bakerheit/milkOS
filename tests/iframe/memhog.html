<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Memory hog frame</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; margin: 14px; background: #fffdf8; color: #3a2e28; } iframe { border: 2px solid #b8a48c; background: #fff; display: block; margin: 6px 0; }</style>
</head><body>
<h2>A frame that eats memory</h2>
<p id="ticks">ticks: 0</p>
<iframe id="hog" name="hog" src="/memhog-child.html" width="420" height="80"></iframe>
<script>
  var ticks = 0;
  setInterval(function () { ticks++; document.getElementById('ticks').textContent = 'ticks: ' + ticks; if (ticks % 5 === 0) report('memhog', 'tick', ticks); }, 200);
</script>
</body></html>
