<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Links with targets</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; margin: 14px; background: #fffdf8; color: #3a2e28; } iframe { border: 2px solid #b8a48c; background: #fff; display: block; margin: 6px 0; } a { margin-right: 14px; }</style>
</head><body>
<h2>Links with targets</h2>
<p>
<a id="to-named" href="/target-page.html?by=name" target="named">named</a>
<a id="to-self" href="/target-page.html?by=self" target="_self">_self</a>
</p>
<iframe id="named" name="named" src="about:blank" width="420" height="80"></iframe>
<iframe id="outer" name="outer" src="/target-outer.html" width="460" height="170"></iframe>
<script>
  window.addEventListener('message', function (e) { if (String(e.data).indexOf('target:') === 0) console.log('IFRTEST target message ' + String(e.data).slice(7)); });
  function outerClick(id) { frames.outer.document.getElementById(id).click(); }
  window.addEventListener('load', function () {
    setTimeout(function () { document.getElementById('to-named').click(); }, 800);
    setTimeout(function () { outerClick('to-sibling'); }, 1600);
    setTimeout(function () { outerClick('to-inner'); }, 2400);
    setTimeout(function () {
      report('target', 'named-path', frames.named.location.pathname + frames.named.location.search);
      report('target', 'inner-path', frames.outer.frames.inner.location.pathname + frames.outer.frames.inner.location.search);
      report('target', 'top-path', location.pathname);
    }, 3300);
    // Last: a link in a frame aimed at its parent replaces this page; one at the top too.
    setTimeout(function () { outerClick('to-parent'); }, 4000);
  });
</script>
</body></html>
