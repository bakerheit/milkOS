<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Workers: in a frame</title>
<script src="/report.js"></script>
</head><body>
<h2>A frame that makes a worker, then goes away</h2>
<iframe id="f" src="/frame-child.html" width="300" height="60"></iframe>
<script>
  addEventListener('message', function (e) {
    if (e.data !== 'ticking') return;
    report('frame', 'ticking', 'the frame\'s worker runs');
    setTimeout(function () {
      var f = document.getElementById('f');
      f.parentNode.removeChild(f);
      report('frame', 'removed', 'frame gone');
    }, 600);
  });
</script>
</body></html>
