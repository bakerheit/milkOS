<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Scrolling frames</title>
<script src="/report.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; background: #fffdf8; color: #3a2e28; height: 1600px; }
  h3 { position: absolute; left: 20px; top: 6px; margin: 0; }
  iframe { position: absolute; border: 2px solid #b8a48c; background: #fff; }
  #tall { left: 20px; top: 40px; width: 420px; height: 160px; }
  #in { left: 20px; top: 230px; width: 420px; height: 110px; }
  #pad { position: absolute; left: 20px; top: 380px; }
</style>
</head><body>
<h3>A frame with more in it than it shows</h3>
<iframe id="tall" name="tall" src="/tall"></iframe>
<iframe id="in" name="in" src="/input-child.html"></iframe>
<p id="pad">the parent goes on and on below here</p>
<script>
  window.addEventListener('message', function (e) {
    console.log('IFRTEST scroll message ' + e.data);
  });
  var last = 0;
  setInterval(function () {
    var y = Math.round(window.scrollY);
    if (y !== last) { last = y; console.log('IFRTEST scroll parent-scrolled ' + y); }
  }, 200);
</script>
</body></html>
