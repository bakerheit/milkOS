# Release automation. Optional: the same thing is done by hand with scripts/publish-release.sh
# (docs/releasing.md), and this file only calls it. Delete this file (or turn Actions off in the
# repository settings) and nothing else changes.
#
# On a pushed tag vX.Y.Z (or vX.Y.Z-rc.N ...): scripts/publish-release.sh checks the tag is
# v$(cat VERSION) and is on main, builds the bundle with MILKOS_RELEASE=1 scripts/release.sh,
# writes SHA256SUMS, takes the notes from CHANGELOG.md, and creates a DRAFT Release with both
# files attached. A human reads the draft on GitHub and presses Publish. A bad draft is
# deleted, never fixed by moving the tag.
# By hand ("Run workflow"): builds the bundle and keeps it as a workflow artifact. It creates
# no Release and no tag.
#
# Runners: this repository is public, so GitHub's standard hosted runners are free for it; the
# jobs use only the standard macos-latest label (the bundle is made with ditto, a macOS tool)
# and nothing here asks for a larger, billed runner. Every job has a timeout.
# Actions are GitHub's own (actions/*), pinned by full commit SHA, the version in a comment.
# Only the Release job can write; it uses the built-in GITHUB_TOKEN and no other credential.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  draft-release:
    name: draft Release for the tag
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install --profile minimal
          rustup show
      - name: Build the bundle and create the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh "$TAG"

  bundle:
    name: bundle as a workflow artifact (no Release)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install --profile minimal
          rustup show
      - name: Check the version numbers agree
        run: scripts/version-check.sh
      - name: Build the bundle (a release build, as scripts/release.sh does)
        run: MILKOS_RELEASE=1 scripts/release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milkOS-bundle
          path: |
            dist/milkOS-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
