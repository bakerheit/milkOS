<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Memory hog</title>

<body style="font-family: sans-serif; margin: 8px; background: #f8e0e0; color: #3a2e28">

  report('memhog-child', 'begin', 'allocating');
