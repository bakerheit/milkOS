<!DOCTYPE html>
<html><head><title>Embedded content</title>
<style>
body { font-family: sans-serif; margin: 16px; max-width: 720px; }
h1 { font-size: 24px; margin: 0 0 8px; }
.card { border: 1px solid #c9bfb0; border-radius: 6px; padding: 12px; margin: 12px 0; background: #fffaf0; }
.card h2 { font-size: 16px; margin: 0 0 8px; }
iframe.widget { display: block; width: 100%; height: 150px; border: 1px solid #8a7f72; }
iframe.tall { width: 320px; height: 220px; border: 2px solid #4f64a0; }
.row { display: flex; gap: 12px; align-items: flex-start; }
figcaption { font-size: 13px; color: #6b5f55; }
</style></head>
<body>
<h1>Embedded content</h1>
<p>The boxes below are separate documents, each with its own layout and its own scrolling.</p>
<div class="card">
<h2>A small widget</h2>
<iframe class="widget" src="widget.html" title="widget"></iframe>
</div>
<div class="row">
<figure style="margin:0">
<iframe class="tall" src="list.html" name="list"></iframe>
<figcaption>A long list in a 320 x 220 frame</figcaption>
</figure>
<figure style="margin:0">
<iframe width="200" height="120" srcdoc="<body style='margin:8px;background:#e8f0e0'><b>Inline document</b><p>This one comes from the srcdoc attribute.</p>"></iframe>
<figcaption>srcdoc</figcaption>
</figure>
</div>
<p>After the frames the page goes on, <a href="next.html">a link</a>.</p>
</body></html>
