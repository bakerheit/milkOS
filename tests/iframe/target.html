<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Links with targets</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; margin: 14px; background: #fffdf8; color: #3a2e28; } iframe { border: 2px solid #b8a48c; background: #fff; display: block; margin: 6px 0; } a { margin-right: 14px; }</style>
</head><body>
<h2>Links with targets</h2>
<p>
<a id="to-named" href="/target-page.html?by=name" target="named">named</a>
<a id="to-self" href="/target-page.html?by=self" target="_self">_self</a>
<a id="to-missing" href="/plain.txt" target="nobody-has-this-name">unknown name</a>
</p>
<iframe id="named" name="named" src="about:blank" width="420" height="80"></iframe>
<iframe id="outer" name="outer" src="/target-outer.html" width="460" height="170"></iframe>
<script>
  var got = [];
  window.addEventListener('message', function (e) { if (String(e.data).indexOf('target:') === 0) got.push(String(e.data).slice(7)); });
  window.__click = function (id) { document.getElementById(id).click(); };
  window.__report = function () {
    report('target', 'messages', got.join(' | '));
    report('target', 'named-path', document.getElementById('named').contentWindow.location.pathname + document.getElementById('named').contentWindow.location.search);
    report('target', 'outer-path', document.getElementById('outer').contentWindow.location.pathname);
    report('target', 'top-path', location.pathname);
    report('target', 'end', 'done');
  };
</script>
</body></html>
