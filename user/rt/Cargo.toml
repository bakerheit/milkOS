[package]
name = "rt"
version.workspace = true
edition.workspace = true

[lib]
test = false
bench = false

[dependencies]
# The shared crypto primitives (<repo>/crypto, also linked into the kernel).
milkcrypto = { path = "../../crypto" }
# The heap allocator (<repo>/user/heapkit), installed as the global allocator in heap.rs.
heapkit = { path = "../heapkit" }
