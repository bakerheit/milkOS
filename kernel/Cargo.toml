[package]
name = "milkos-kernel"
# The milkOS version lives in <repo>/VERSION (kernel/build.rs: MILKOS_VERSION).
version = "0.0.0"
edition = "2024"

[[bin]]
name = "milkos-kernel"
test = false
bench = false

[features]
# Boot self-test ends with a deliberate bad-pointer read to prove the crash dump.
crash-test = []
# Scheduler self-test ends with a thread recursing forever, to prove the stack guard.
kstack-overflow-test = []
# Log every syscall (pid, number, result) to the console.
strace = []
