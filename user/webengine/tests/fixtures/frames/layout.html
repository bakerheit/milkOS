<!DOCTYPE html>
<html><head><title>Frames in layout</title>
<style>
body { font-family: sans-serif; margin: 12px; background: #fffdf8; }
.stage { position: relative; width: 420px; height: 200px; border: 1px solid #b8ad9f; margin-bottom: 12px; }
.stage iframe { position: absolute; left: 20px; top: 20px; width: 260px; height: 150px; border: 3px solid #4f64a0; }
.badge { position: absolute; left: 230px; top: 6px; background: #b43a3a; color: white; font-size: 12px; padding: 3px 8px; border-radius: 10px; z-index: 5; }
.inline p { margin: 4px 0; }
.inline iframe { width: 90px; height: 40px; vertical-align: middle; border: 1px dashed #8a7f72; }
.hidden { display: none; }
</style></head>
<body>
<div class="stage">
<iframe src="widget.html"></iframe>
<span class="badge">on top</span>
</div>
<div class="inline">
<p>Text, <iframe srcdoc="<body style='margin:4px;background:#e8e0f0;font:12px sans-serif'>inline"></iframe> and more text, <iframe srcdoc="<body style='margin:4px;background:#e0f0e8;font:12px sans-serif'>twice"></iframe> in one line.</p>
</div>
<iframe class="hidden" src="widget.html"></iframe>
<iframe style="visibility:hidden" width="100" height="30" srcdoc="not shown"></iframe>
<p>The end.</p>
</body></html>
