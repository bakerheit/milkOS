<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sandboxed frames</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; margin: 10px; background: #fffdf8; color: #3a2e28; font-size: 12px; } iframe { border: 2px solid #b8a48c; background: #fff; margin: 2px; vertical-align: top; }</style>
</head><body>
<div>
<iframe id="s-all" name="s-all" sandbox src="/sandbox-child.html" width="200" height="130"></iframe>
<iframe id="s-scripts" name="s-scripts" sandbox="allow-scripts" src="/sandbox-child.html" width="200" height="130"></iframe>
<iframe id="s-same" name="s-same" sandbox="allow-same-origin" src="/sandbox-child.html" width="200" height="130"></iframe>
</div><div>
<iframe id="s-both" name="s-both" sandbox="allow-scripts allow-same-origin" src="/sandbox-child.html" width="200" height="130"></iframe>
<iframe id="s-forms" name="s-forms" sandbox="allow-scripts allow-forms" src="/sandbox-child.html?forms=1" width="200" height="130"></iframe>
<iframe id="s-top" name="s-top" sandbox="allow-scripts allow-top-navigation" src="/sandbox-child.html" width="200" height="130"></iframe>
</div>
<div>
<iframe id="s-nested" name="s-nested" sandbox="allow-scripts allow-same-origin" srcdoc="<body style='font-family:sans-serif;font-size:12px;background:#e8f2e0'>sandboxed parent of a frame without a sandbox attribute:<br><iframe name='inner' src='/sandbox-child.html?inner=1' width='180' height='90'></iframe></body>" width="420" height="150"></iframe>
<iframe id="s-csp" name="s-csp" src="/csp/sandbox.html" width="200" height="70"></iframe>
</div>
<script>
  var got = {};
  var frames_by_id = ['s-all', 's-scripts', 's-same', 's-both', 's-forms', 's-top'];
  window.addEventListener('message', function (e) {
    var d = String(e.data);
    if (d.indexOf('probe:') === 0) {
      var p = JSON.parse(d.slice(6));
      p.fromOrigin = e.origin;
      got[p.name] = p;
    } else if (d.indexOf('echo:') === 0) {
      got.echo = d.slice(5) + ' @' + e.origin;
    }
  });
  var started = false;
  function check() {
    var s = got['s-scripts'], b = got['s-both'];
    report('sandbox', 'no-script-no-message', String(!got['s-all'] && !got['s-same']));
    report('sandbox', 's-scripts-origin', s && (s.origin + ' / event.origin ' + s.fromOrigin));
    report('sandbox', 's-scripts-cookie', s && s.cookie);
    report('sandbox', 's-scripts-storage', s && s.storage);
    report('sandbox', 's-scripts-confirm', s && s.confirm);
    report('sandbox', 's-scripts-open', s && s.open);
    report('sandbox', 's-scripts-same-origin-parent', s && s.parentDoc);
    report('sandbox', 's-both-origin', b && (b.origin + ' / event.origin ' + b.fromOrigin));
    report('sandbox', 's-both-cookie', b && b.cookie);
    report('sandbox', 's-both-storage', b && b.storage);
    report('sandbox', 's-both-parent-doc', b && b.parentDoc);
    report('sandbox', 's-all-contentDocument', tryit(function () { return document.getElementById('s-all').contentDocument; }));
    report('sandbox', 's-same-readable', tryit(function () { return document.getElementById('s-same').contentDocument.getElementById('nojs').textContent; }));
    report('sandbox', 's-scripts-contentDocument', tryit(function () { return document.getElementById('s-scripts').contentDocument; }));
    report('sandbox', 's-nested-inner', got.inner ? (got.inner.origin + ' ' + got.inner.cookie) : 'none');
    report('sandbox', 'end', 'done');
  }
  window.addEventListener('load', function () {
    setTimeout(check, 2500);
    // Later: a sandbox without allow-top-navigation may not take the tab away; one with it may.
    setTimeout(function () {
      document.getElementById('s-scripts').contentWindow.postMessage('go-top', '*');
      setTimeout(function () {
        report('sandbox', 'top-after-blocked', location.pathname);
        document.getElementById('s-top').contentWindow.postMessage('go-top', '*');
      }, 1200);
    }, 3500);
  });
</script>
</body></html>
