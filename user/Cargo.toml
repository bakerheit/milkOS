# milkOS userland. A separate workspace (own target settings and linker script); the
# kernel's build.rs builds it with `cargo build --release` into target/user, so a plain
# `cargo build` at the repo root builds these too. See docs/processes.md.
[workspace]
resolver = "2"
members = ["rt", "init", "hello", "msh", "fault", "utest", "coreutils", "disks", "stty", "gui", "paint", "desk", "network", "httpd", "play", "audit", "apps", "versions", "fsstress", "search", "peek", "store", "drop", "timekit", "timeio", "timetools", "appkit", "clock", "calendar", "sysview", "activity", "diskkit", "reminders", "diskutil", "tcpbench", "milkd", "udrv", "rngd", "soundd", "filekit", "cmdkit", "heapkit", "filetools", "syskit", "systools", "textbuf", "imgdec", "texteditor", "preview", "textkit", "texttools", "tlsprobe", "webengine", "webbench"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
