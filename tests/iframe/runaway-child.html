<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Runaway</title>
<script src="/report.js"></script></head>
<body style="font-family: sans-serif; margin: 8px; background: #f8e0e0; color: #3a2e28">
<p id="state">about to loop for ever</p>
<script>
  report('runaway-child', 'begin', 'looping');
  setTimeout(function () {
    document.getElementById('state').textContent = 'looping...';
    var n = 0;
    while (true) { n++; }
  }, 300);
</script>
