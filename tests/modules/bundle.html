<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Cheese shop (modules)</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #fffdf8; color: #3a2e28; }
  .header { background: #4f64a0; color: #fffdf8; padding: 14px 24px; }
  .header h1 { margin: 0; font-size: 26px; }
  .header .badge { float: right; background: #e8c070; color: #3a2e28; border-radius: 12px; padding: 2px 12px; font-weight: bold; }
  .header small { color: #d8defa; }
  .page { padding: 16px 24px; }
  .card { border: 2px solid #c4ae8f; border-radius: 8px; background: #efe6d4; padding: 8px 14px; margin: 8px 0; }
  .card b { font-size: 19px; }
  .card .price { float: right; font-weight: bold; }
  .card .age { height: 8px; background: #e8c070; border-radius: 4px; margin-top: 6px; }
  .card button { margin-top: 6px; padding: 3px 14px; background: #4f64a0; color: #fffdf8; border: 0; border-radius: 4px; }
  .cart { border: 2px dashed #4f64a0; border-radius: 8px; margin-bottom: 14px; padding: 8px 14px; background: #fff7e0; }
  .cart .line { padding: 2px 0; }
  .cart .total { font-size: 22px; margin-top: 8px; color: #4f64a0; }
  .empty { color: #7a6a5a; font-style: italic; }
</style>
<script src="/classic.js"></script>
</head><body>
<div id="app"></div>
<script type="module" src="/bundle/main.js"></script>
</body></html>
