<!DOCTYPE html>
<html><head><title>Forms</title>
<style>
body { font-family: sans-serif; margin: 16px; max-width: 520px; }
fieldset { margin-bottom: 12px; }
label { display: block; margin: 6px 0 2px; }
input[type=text], input[type=password], input[type=email], textarea, select { width: 100%; box-sizing: border-box; }
.inline label { display: inline; margin-right: 12px; }
button.primary { background: #2b6cb0; color: white; border: none; padding: 6px 14px; border-radius: 4px; }
</style></head>
<body>
<form action="/login" method="post">
<fieldset><legend>Sign in</legend>
<label for="u">User name</label><input id="u" type="text" name="user" value="milk" placeholder="you@example.org">
<label for="p">Password</label><input id="p" type="password" name="pass">
<div class="inline"><label><input type="checkbox" name="remember" checked> Remember me</label><label><input type="radio" name="mode" value="a" checked> A</label><label><input type="radio" name="mode" value="b"> B</label></div>
<label>Plan</label><select name="plan"><option value="free">Free</option><option value="pro" selected>Pro</option><option>Team</option></select>
<label>Notes</label><textarea name="notes" rows="3">Hello
world</textarea>
<input type="hidden" name="csrf" value="tok en">
<p><button class="primary" type="submit">Sign <b>in</b></button> <input type="submit" name="go" value="Go"> <input type="reset"></p>
</fieldset>
</form>
<form action="search" method="get"><input type="search" name="q" value="milk &amp; honey"> <input type="submit" value="Search"></form>
</body></html>
