[package]
name = "tls"
version = "0.0.1"
edition = "2024"

# The TLS 1.3 client of milkOS (RFC 8446): handshake, record layer, X.509 path validation and
# the compiled-in Mozilla root store (assets/ca). no_std + alloc, on milkcrypto only; shared
# by the kernel (kernel/src/net/tls.rs, for the Browser) and userland (rt::tls). The host
# tests are scripts/tls-test.sh; the interop test against OpenSSL is scripts/tls-interop.sh.
# See docs/tls.md.
[dependencies]
milkcrypto = { path = "../crypto" }

[lib]
bench = false
doctest = false
