[package]
name = "milkos-kernel"
# The milkOS version lives in <repo>/VERSION (kernel/build.rs: MILKOS_VERSION); the package
# version follows it (docs/versioning.md).
version.workspace = true
edition = "2024"

[[bin]]
name = "milkos-kernel"
test = false
bench = false

[dependencies]
# Shared crypto primitives (also used by userland through rt): <repo>/crypto.
milkcrypto = { path = "../crypto" }
# The TLS 1.3 client (no_std, host-tested): <repo>/tls. net/tls.rs is its kernel glue.
tls = { path = "../tls" }
# The milkfs file system (no_std, host-tested): <repo>/milkfs. fs/milkfs is its VFS glue.
milkfs = { path = "../milkfs" }
# URLs, the HTTP/1.1 client, DNS messages and the HTML subset (no_std, host-tested):
# <repo>/milkweb. The Browser and net::dns use it; so does user space (rt::web).
milkweb = { path = "../milkweb" }
# The rules behind files and the Trash, shared with user space (pure, host-tested):
# <repo>/user/filekit.
filekit = { path = "../user/filekit" }
# Image decoders (no_std, host-tested): <repo>/user/imgdec. The photo wallpapers are JPEG files
# decoded when chosen (wm/wallpaper.rs).
imgdec = { path = "../user/imgdec" }
# The system fonts' blob format, fallback and measuring, shared with user space (appkit's
# text; pure, host-tested): <repo>/user/fontkit.
fontkit = { path = "../user/fontkit" }

# The Raspberry Pi pieces that are pure (device tree, command line, mailbox messages, SD
# commands; no_std, host-tested): <repo>/rpikit.
rpikit = { path = "../rpikit" }

[features]
# Build for the Raspberry Pi 4 (BCM2711; also qemu -M raspi4b) instead of qemu virt: the image is
# linked for the Pi firmware's load address (0x80000) and the board table in platform.rs is the
# Pi's. One source tree, two images (docs/raspberry-pi.md).
raspi = []
# Boot self-test ends with a deliberate bad-pointer read to prove the crash dump.
crash-test = []
# Scheduler self-test ends with a thread recursing forever, to prove the stack guard.
kstack-overflow-test = []
# Log every syscall (pid, number, result) to the console.
strace = []
# Secondaries wait 200 ms between coming online and joining the scheduler (regression
# test for IPIs/ticks/work reaching a CPU before it joined; see scripts/serial-soak.sh).
smp-join-delay = []
