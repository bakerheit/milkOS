[workspace]
resolver = "2"
members = ["kernel", "crypto", "milkfs", "milkweb", "tls", "rpikit"]
# user/ is its own workspace (built by kernel/build.rs); so is tls/probe (a host test tool).
exclude = ["user", "tls/probe"]

# Every package here (and the user/ workspace, and tls/probe) has the version in <repo>/VERSION.
# scripts/cut-release.sh changes them together; scripts/version-check.sh fails if one differs.
[workspace.package]
version = "0.2.0"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
