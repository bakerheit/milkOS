<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sandbox probe</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; font-size: 12px; margin: 6px; background: #f8f0d8; color: #3a2e28; }</style>
</head><body>
<p id="nojs">scripts did not run</p>
<form id="f" action="/echo?from=sandbox" method="post"><input type="hidden" name="k" value="v"><input type="submit" value="Send"></form>
<script>
  document.getElementById('nojs').textContent = 'scripts ran';
  var q = location.search;
  function run(name) {
    var p = {
      name: name,
      origin: String(window.origin),
      cookie: tryit(function () { document.cookie = 'probe=1'; return document.cookie ? 'readable' : 'empty'; }),
      storage: tryit(function () { localStorage.setItem('probe', '1'); return localStorage.getItem('probe'); }),
      confirm: q.indexOf('forms') >= 0 ? 'skipped' : tryit(function () { return confirm('Is this blocked?'); }),
      open: q.indexOf('forms') >= 0 ? 'skipped' : tryit(function () { return window.open('/plain.txt'); }),
      parentDoc: tryit(function () { return typeof parent.document.title; })
    };
    parent.postMessage('probe:' + JSON.stringify(p), '*');
    console.log('IFRTEST sandbox-child ' + name + ' ' + p.origin + ' cookie=' + p.cookie + ' storage=' + p.storage);
    if (q.indexOf('forms') >= 0) {
      document.getElementById('f').submit();
    }
  }
  run(window.name || (q.indexOf('inner') >= 0 ? 'inner' : 'none'));
  window.addEventListener('message', function (e) {
    if (e.data === 'go-top') {
      try { top.location.href = '/landed.html'; } catch (err) { console.log('IFRTEST sandbox-child top-nav threw ' + err.name); }
    }
  });
</script>
</body></html>
