<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Many frames</title>
<script src="/report.js"></script>
<style>body { font-family: sans-serif; margin: 10px; background: #fffdf8; color: #3a2e28; } iframe { border: 1px solid #b8a48c; background: #fff; margin: 2px; width: 90px; height: 40px; }</style>
</head><body>
<div id="holder"></div>
<script>
  var holder = document.getElementById('holder'), made = 0, loaded = 0;
  for (var i = 0; i < 45; i++) {
    var f = document.createElement('iframe');
    f.srcdoc = '<body style="margin:2px;font-size:10px">frame ' + i + '<script>console.log("IFRTEST many frame-' + i + ' shown")<\/script>';
    f.addEventListener('load', function () { loaded++; });
    holder.appendChild(f); made++;
  }
  window.addEventListener('load', function () {
    setTimeout(function () {
      report('many', 'made', made);
      report('many', 'loaded', loaded);
      report('many', 'frames-length', window.frames.length);
      report('many', 'end', 'done');
    }, 1500);
  });
</script>
</body></html>
