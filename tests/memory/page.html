<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Memory: a page that holds a lot</title>
<script src="/report.js"></script><script src="/hog.js"></script>
<style>body { font-family: sans-serif; margin: 14px; background: #fffdf8; color: #3a2e28; }</style>
</head><body>
<h2>A page that holds memory</h2>
<p id="ticks">ticks: 0</p>
<p id="state">allocating</p>
<script>
  var a = args(location.search), ticks = 0, mb = +a.mb || 50, kind = a.kind || 'objects';
  setInterval(function () { ticks++; document.getElementById('ticks').textContent = 'ticks: ' + ticks; if (ticks % 5 === 0) report('page', 'tick', ticks); }, 200);
  report('page', 'begin', mb + ' ' + kind);
  setTimeout(function () {
    hogRun(mb, kind, function (ms) { document.getElementById('state').textContent = 'holding ' + mb + ' MB'; report('page', 'held', mb + 'MB in ' + ms + 'ms'); },
      function (n) { document.getElementById('state').textContent = 'allocated ' + n + ' MB'; });
  }, 300);
</script>
</body></html>
