<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bundle in a frame</title>
<script src="/report.js"></script></head>
<body style="font-family: sans-serif; margin: 6px; background: #eef4e8">
<script>
  var a = args(location.search), mb = +a.mb || 3;
  var s = document.createElement('script');
  s.src = '/bundle.js?mb=' + mb;
  s.onload = function () { report('bundle', 'frame-loaded', mb); };
  s.onerror = function () { report('bundle', 'frame-error', mb); };
  document.head.appendChild(s);
</script>
</body></html>
